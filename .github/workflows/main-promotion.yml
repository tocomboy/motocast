name: Main Promotion Policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  develop-only:
    name: develop-only
    runs-on: ubuntu-latest
    steps:
      - name: Require the repository develop branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$BASE_REF" != "main" ] || [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPOSITORY" != "$THIS_REPOSITORY" ]; then
            echo "Only a pull request from this repository's develop branch may target main."
            exit 1
          fi
          echo "Validated promotion path: develop -> main"
